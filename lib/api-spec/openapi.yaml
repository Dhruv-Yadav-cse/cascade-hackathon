openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: CASCADE decision consequence analysis API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyses
    description: Decision analysis workspaces
  - name: simulations
    description: Scenario simulation results
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyses:
    get:
      operationId: listAnalyses
      tags: [analyses]
      summary: List analysis history
      responses:
        "200":
          description: Analysis summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisSummary"
    post:
      operationId: createAnalysis
      tags: [analyses]
      summary: Create an analysis workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "201":
          description: Created analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
  /analyses/{analysisId}:
    get:
      operationId: getAnalysis
      tags: [analyses]
      summary: Get an analysis workspace
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "200":
          description: Analysis workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
    patch:
      operationId: updateAnalysis
      tags: [analyses]
      summary: Update an analysis workspace
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisUpdate"
      responses:
        "200":
          description: Updated analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
  /analyses/{analysisId}/analyze:
    post:
      operationId: analyzeAnalysis
      tags: [analyses]
      summary: Start structured analysis
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "202":
          description: Analysis accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
  /analyses/{analysisId}/graph:
    get:
      operationId: getAnalysisGraph
      tags: [analyses]
      summary: Get the normalized obligation graph
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "200":
          description: Graph nodes and edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Graph"
  /analyses/{analysisId}/scenarios:
    get:
      operationId: listScenarios
      tags: [analyses]
      summary: List scenarios for an analysis
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "200":
          description: Scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scenario"
  /scenarios/{scenarioId}/simulate:
    post:
      operationId: simulateScenario
      tags: [simulations]
      summary: Start a deterministic scenario simulation
      parameters:
        - $ref: "#/components/parameters/ScenarioId"
      responses:
        "202":
          description: Simulation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationRun"
  /simulation-runs/{runId}:
    get:
      operationId: getSimulationRun
      tags: [simulations]
      summary: Get simulation status and summary
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Simulation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationRun"
  /simulation-runs/{runId}/paths:
    get:
      operationId: getSimulationPaths
      tags: [simulations]
      summary: Get ranked cascade paths
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Ranked consequence paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CascadePath"
  /simulation-runs/{runId}/timeline:
    get:
      operationId: getSimulationTimeline
      tags: [simulations]
      summary: Get projected timeline events
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"
components:
  parameters:
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalysisSummary:
      type: object
      required: [id, title, status, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/AnalysisStatus"
        updatedAt:
          type: string
          format: date-time
        riskScore:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
    Analysis:
      allOf:
        - $ref: "#/components/schemas/AnalysisSummary"
        - type: object
          required: [decision, objective, horizon]
          properties:
            decision:
              type: string
            objective:
              type: ["string", "null"]
            horizon:
              type: string
            createdAt:
              type: string
              format: date-time
    AnalysisInput:
      type: object
      required: [title, decision]
      properties:
        title:
          type: string
          minLength: 1
        decision:
          type: string
          minLength: 1
        objective:
          type: string
        horizon:
          type: string
    AnalysisUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        decision:
          type: string
          minLength: 1
        objective:
          type: string
        horizon:
          type: string
    AnalysisRun:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RunStatus"
    Graph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
    GraphNode:
      type: object
      required: [id, type, label]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NodeType"
        label:
          type: string
        confidence:
          type: ["number", "null"]
          minimum: 0
          maximum: 1
    GraphEdge:
      type: object
      required: [id, source, target, type]
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          format: uuid
        target:
          type: string
          format: uuid
        type:
          type: string
        confidence:
          type: ["number", "null"]
          minimum: 0
          maximum: 1
        rationale:
          type: ["string", "null"]
    Scenario:
      type: object
      required: [id, name, type, description]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/ScenarioType"
        description:
          type: string
    SimulationRun:
      type: object
      required: [id, scenarioId, status]
      properties:
        id:
          type: string
          format: uuid
        scenarioId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RunStatus"
        riskScore:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
    CascadePath:
      type: object
      required: [id, label, nodeIds, severity]
      properties:
        id:
          type: string
        label:
          type: string
        nodeIds:
          type: array
          items:
            type: string
            format: uuid
        severity:
          type: string
        confidence:
          type: ["number", "null"]
          minimum: 0
          maximum: 1
    TimelineEvent:
      type: object
      required: [id, horizon, title, severity]
      properties:
        id:
          type: string
        horizon:
          type: string
        title:
          type: string
        severity:
          type: string
        causalParentId:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
    AnalysisStatus:
      type: string
      enum: [draft, analyzing, ready, failed]
    RunStatus:
      type: string
      enum: [queued, running, complete, failed]
    ScenarioType:
      type: string
      enum: [planned, delayed, adverse]
    NodeType:
      type: string
      enum:
        - decision
        - person
        - organization
        - contract
        - asset
        - obligation
        - dependency
        - event
        - assumption

